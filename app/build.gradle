apply plugin: 'com.android.application'
android {
    namespace 'com.mirror.bench'
    compileSdk 35
    buildToolsVersion '35.0.1'
    defaultConfig {
        applicationId 'com.mirror.bench'
        minSdk 24
        targetSdk 30
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['task'] }
}
dependencies { implementation 'com.google.mediapipe:tasks-vision:1.0.0' }
