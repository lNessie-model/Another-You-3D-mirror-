apply plugin: 'com.android.application'
android {
    namespace 'com.mirror.bench'
    compileSdk 35
    buildToolsVersion '35.0.1'
    defaultConfig {
        applicationId 'com.mirror.bench'
        minSdk 24
        targetSdk 30
        versionCode 43
        versionName '0.2.12'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['task']
        // Preserve the SDK's default ignore rules; personal diagnostic face vectors never ship.
        def priorIgnore = ignoreAssetsPattern
        ignoreAssetsPattern = (priorIgnore ?: '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~') + ':expression-validation'
    }
}
dependencies { implementation 'com.google.mediapipe:tasks-vision:1.0.0' }
